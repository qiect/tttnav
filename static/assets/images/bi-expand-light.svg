<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180">
  <!-- 🍬一颗跳跳糖 · 展开状态大 logo，夜间模式用（对应 bi-expand-light.png，白色文字，转 png 建议 640x180） -->
  <defs>
    <radialGradient id="candyBody" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#ffa8c0"/>
      <stop offset="55%" stop-color="#ff5c8a"/>
      <stop offset="100%" stop-color="#f1404b"/>
    </radialGradient>
    <linearGradient id="candyWrap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7ba3"/>
      <stop offset="100%" stop-color="#e83e6c"/>
    </linearGradient>
  </defs>

  <!-- 糖果图形（缩放至 160 高，居左） -->
  <g transform="translate(4,10) scale(0.8)">
    <path d="M62 100 C48 76 28 66 8 70 L22 100 L8 130 C28 134 48 124 62 100 Z" fill="url(#candyWrap)"/>
    <path d="M138 100 C152 76 172 66 192 70 L178 100 L192 130 C172 134 152 124 138 100 Z" fill="url(#candyWrap)"/>
    <ellipse cx="100" cy="100" rx="46" ry="40" fill="url(#candyBody)"/>
    <path d="M70 68 q18 20 6 52" stroke="#ffffff" stroke-width="8" fill="none" opacity=".55" stroke-linecap="round"/>
    <path d="M94 63 q15 26 2 64" stroke="#ffffff" stroke-width="6" fill="none" opacity=".38" stroke-linecap="round"/>
    <ellipse cx="84" cy="83" rx="17" ry="10" fill="#ffffff" opacity=".5" transform="rotate(-28 84 83)"/>
  </g>

  <!-- 文字（夜间模式 → 白色文字） -->
  <text x="188" y="96" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif" font-size="64" font-weight="800" fill="#ffffff">一颗跳跳糖</text>
  <text x="192" y="140" font-family="'PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif" font-size="24" font-weight="400" fill="rgba(255,255,255,.72)" letter-spacing="2">实用软件与精品网站导航</text>
</svg>
