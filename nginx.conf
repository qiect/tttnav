server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 子路径前缀剥离后内部重匹配（兼容外层代理不去前缀的写法）
    location /tttnav/ {
        rewrite ^/tttnav/(.*)$ /$1 last;
    }
    location = /tttnav {
        return 301 /tttnav/;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # HTML 不缓存，保证站点更新即时生效
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
